name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test all services
        run: ./mvnw clean verify

  docker-build:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - booking-service
          - payment-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Package service
        run: ./mvnw -pl backend/${{ matrix.service }} -am package -DskipTests

      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} ./backend/${{ matrix.service }}
